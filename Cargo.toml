[workspace]
resolver = "2"
members = [
    "crates/thine-common",
    "crates/thine-storage",
    "crates/thine-ingest",
    "crates/thine-server",
]
default-members = ["crates/thine-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Thine Metrics Contributors"]
repository = "https://github.com/Jubayer1228/thine-metrics"

[workspace.dependencies]
thine-common = { path = "crates/thine-common" }
thine-storage = { path = "crates/thine-storage" }
thine-ingest = { path = "crates/thine-ingest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "6"
parking_lot = "0.12"
bytes = "1"
base64 = "0.22"
futures = "0.3"
tokio-stream = "0.1"
rand = "0.9"
